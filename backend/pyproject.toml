[project]
name = "wcm-sales-assistant-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic-settings>=2.5",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "pyotp>=2.9",
  "certifi>=2024.8",
  "selectolax>=0.3",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true
